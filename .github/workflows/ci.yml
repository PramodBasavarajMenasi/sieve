name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sieve
          POSTGRES_PASSWORD: sieve
          POSTGRES_DB: sieve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sieve -d sieve_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # Without it the database tests are skipped.
      SIEVE_TEST_DATABASE_URL: postgresql+psycopg://sieve:sieve@localhost:5432/sieve_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: mypy
        run: uv run mypy src tests scripts

      - name: pytest
        run: uv run pytest
