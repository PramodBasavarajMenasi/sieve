services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sieve
      POSTGRES_PASSWORD: sieve
      POSTGRES_DB: sieve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sieve -d sieve"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      SIEVE_DATABASE_URL: postgresql+psycopg://sieve:sieve@postgres:5432/sieve
      SIEVE_API_TOKEN: ${SIEVE_API_TOKEN:-dev-token}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
