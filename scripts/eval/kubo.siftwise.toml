# .siftwise.toml for ipfs/kubo, used by scripts/eval_kubo.py (kubo itself has none).
#
# test/cli runs the built `ipfs` binary, so it depends on every non-test Go file linked into
# ./cmd/ipfs, with no Go import edge to that code. Approximated here as "any non-test Go
# file". This is coarse: test/cli is ~85% of kubo's test time.

[[depends]]
tests = "test/cli/**"
on = ["**/*.go", "!**/*_test.go", "!docs/**", "!test/dependencies/**"]
